name: Publish routes

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'build.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-routes
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static route data
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          force_orphan: false
